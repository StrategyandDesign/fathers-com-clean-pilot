name: Unpack export

on:
  push:
    paths:
      - "export/COMPLETE"

jobs:
  unpack:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Unpack and commit the Next.js tree
        run: |
          set -euo pipefail
          test -f export/COMPLETE
          cat export/part-* | base64 -d > /tmp/tree.tar.gz
          tar -xzf /tmp/tree.tar.gz
          rm -rf export
          rm -f .github/workflows/unpack-export.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unpack isolated clean-pilot Next.js tree"
          git push
