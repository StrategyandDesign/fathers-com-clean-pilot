name: Shared marks

on:
  schedule:
    - cron: "*/2 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/shared-sync.yml"
      - "shared-source.json"
      - "scripts/shared-sync-from-internal.mjs"

permissions:
  contents: write
  issues: write

jobs:
  publish:
    if: github.repository == 'StrategyandDesign/fathers-com-clean-pilot'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout review
        uses: actions/checkout@v4
        with:
          ref: review
          fetch-depth: 0

      - name: Hold local desk ticks off Eric's copy
        run: |
          set -euo pipefail
          HOLD=$(node -p "Boolean(require('./shared-source.json').hold)")
          if [ "$HOLD" = "true" ]; then
            echo "Hold is on. Shared 7 / Shared 1-1.101 stays on review until Micah asks to publish."
            exit 0
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Use the internal sync script
        run: |
          set -euo pipefail
          SOURCE_REPO=$(node -p "require('./shared-source.json').repo")
          SOURCE_BRANCH=$(node -p "require('./shared-source.json').branch")
          rm -rf /tmp/fathers-shared-script
          git clone --depth 1 --branch "$SOURCE_BRANCH" "https://github.com/${SOURCE_REPO}.git" /tmp/fathers-shared-script
          cp /tmp/fathers-shared-script/scripts/shared-sync-from-internal.mjs scripts/shared-sync-from-internal.mjs

      - name: Publish the next Shared mark
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path("scripts/shared-sync-from-internal.mjs")
          text = path.read_text()
          needle = '"lib/i18n/translate.ts",'
          extra = '"lib/i18n/translate.ts",\n  ".github/workflows/shared-sync.yml",'
          if ".github/workflows/shared-sync.yml" not in text:
              if needle not in text:
                  raise SystemExit("could not keep the shared-repo workflow out of the overlay")
              path.write_text(text.replace(needle, extra, 1))
          PY
          node scripts/shared-sync-from-internal.mjs
